name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um PR novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint · Types · Test · Build
    runs-on: ubuntu-latest

    # Os testes de autorização rodam contra Postgres de verdade. Contra dublê,
    # eles provariam que o dublê concorda com o código — e não que o índice
    # único de e-mail segura, nem que a sessão revogada some da consulta.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharmopet
          POSTGRES_PASSWORD: pharmopet
          POSTGRES_DB: pharmopet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmopet -d pharmopet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pharmopet:pharmopet@localhost:5432/pharmopet
      ALLOWED_ORIGINS: http://localhost:5173
      # Sem TLS entre o job e o serviço; o schema de ambiente só permite isto
      # fora de produção, e é o que mantém a exceção presa ao CI.
      COOKIE_SEGURO: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # O client do Prisma é gerado: sem ele o typecheck falha contra tipos velhos.
      - name: Gerar Prisma Client
        run: pnpm --filter @pharmopet/api prisma:generate

      # Os apps importam os pacotes pelo dist, e num checkout limpo ele não
      # existe. Sem este passo o typecheck do web falha antes de qualquer build.
      - name: Compilar pacotes compartilhados
        run: pnpm build:pacotes

      # `migrate deploy` e não `db push`: é o mesmo caminho da produção, então
      # uma migration quebrada falha aqui e não no deploy.
      - name: Aplicar migrations
        run: pnpm --filter @pharmopet/api prisma:migrate

      # O contrato e o cliente são gerados a partir dos controllers. Regerar aqui
      # e exigir diff zero impede o caso silencioso: a API muda, o cliente
      # continua tipado contra o contrato antigo e o front só descobre em runtime.
      - name: Contrato OpenAPI em dia
        run: |
          pnpm contrato
          git diff --exit-code -- apps/api/openapi.json packages/api-client/src/gerado \
            || { echo "::error::O contrato mudou. Rode 'pnpm contrato' e comite o resultado."; exit 1; }

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  seguranca:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Varredura de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Falha só em vulnerabilidade alta ou crítica, para o gate ser acionável.
      - name: Auditoria de dependências
        run: pnpm audit --audit-level high
