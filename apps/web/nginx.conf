# Servidor estático do front.
#
# TLS, domínio e redirecionamento de HTTP para HTTPS são do proxy do Coolify —
# aqui dentro o tráfego já chegou terminado. Este arquivo cuida só de servir os
# arquivos e de duas coisas que, esquecidas, quebram o deploy de formas que
# demoram a diagnosticar: o fallback do roteador e o cache do index.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos que o front serve por conta própria. O helmet cobre a API; o
    # nginx precisa cobrir o HTML, que não passa por lá.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Os assets do Vite têm hash no nome: o conteúdo de um arquivo com aquele
    # nome nunca muda, então pode ficar cacheado por um ano.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index é a única coisa que muda de conteúdo mantendo o nome. Cacheá-lo
    # faria o navegador continuar pedindo os assets antigos depois de um deploy,
    # e eles não existem mais — tela branca, sem erro visível.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # O react-router resolve as rotas no navegador. Sem este fallback, abrir
    # /receituario direto ou dar F5 numa rota interna devolve o 404 do nginx em
    # vez da aplicação.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
